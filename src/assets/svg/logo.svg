<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 -20 448 153" fill="none" role="img" aria-label="Eleven logo">
  <defs>
    <linearGradient id="logoGradient" x1="0" y1="76.5" x2="448" y2="76.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>
    <filter id="softShadow" x="-5%" y="-10%" width="110%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1E3A8A" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- 把文字和星星作为一组整体居中 -->
  <g transform="translate(45, 0)">
    <!-- 主文字 Eleven -->
    <text
      x="40"
      y="108"
      font-family="Nunito, 'PingFang SC', 'Microsoft YaHei', ui-sans-serif, system-ui, sans-serif"
      font-size="92"
      font-weight="800"
      fill="url(#logoGradient)"
      stroke="#ffffff"
      stroke-width="22"
      stroke-linejoin="round"
      paint-order="stroke fill"
      filter="url(#softShadow)"
      letter-spacing="-2"
    >
      Eleven
    </text>

    <!-- 放在 "en" 上方的小星星 -->
    <path
      fill="url(#logoGradient)"
      stroke="#ffffff"
      stroke-width="14"
      stroke-linejoin="round"
      paint-order="stroke fill"
      opacity="0.9"
      d="M270 18c1.5 8 8 14.5 16 16-8 1.5-14.5 8-16 16-1.5-8-8-14.5-16-16 8-1.5 14.5-8 16-16z"
    />
  </g>
</svg>
